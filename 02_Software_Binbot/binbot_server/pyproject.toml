[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binbot-voice-server"
version = "0.1.0"
description = "BinBot event-driven voice orchestration server"
requires-python = ">=3.11"
dependencies = [
    "amqtt==0.12.2",
    "aiohttp>=3.9,<4",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "esptool==5.1.0",
    "numpy>=1.26,<2.3",
    "onnxruntime>=1.20,<2",
]

[project.optional-dependencies]
audio = ["edge-tts==7.3.1"]
mcp = ["mcp==1.26.0", "uvicorn>=0.31,<1"]
feishu = [
    "lark-oapi>=1.4,<2",
]
dev = [
    "flake8>=6,<8",
    "mypy>=1.8,<2",
    "pytest>=7.4,<9",
]

[project.scripts]
binbot-server = "binbot_server.__main__:main"
binbot-mcp = "binbot_server.transport.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"binbot_server" = ["catalogs/*.json"]
"binbot_server.infrastructure" = ["models/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: opens a local HTTP/WebSocket listener",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
