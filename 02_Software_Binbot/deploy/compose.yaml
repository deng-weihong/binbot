name: binbot-selfhost

services:
  binbot-server:
    build:
      context: ../binbot_server
      args:
        DEBIAN_MIRROR: ${BINBOT_DEBIAN_MIRROR:-deb.debian.org}
        PIP_INDEX_URL: ${BINBOT_PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    ports:
      - "${BINBOT_MQTT_BIND:-127.0.0.1}:${BINBOT_MQTT_PORT:-1883}:1883"
    volumes:
      - binbot-data:/var/lib/binbot
      - ./config.docker.toml:/etc/binbot/config.toml:ro
    environment:
      BINBOT_ADMIN_USERNAME: ${BINBOT_ADMIN_USERNAME:-admin}
      BINBOT_ADMIN_PASSWORD: ${BINBOT_ADMIN_PASSWORD:?set BINBOT_ADMIN_PASSWORD in deploy/.env}
      BINBOT_DEVICE_TOKENS_JSON: "${BINBOT_DEVICE_TOKENS_JSON:-}"
      BINBOT_MODEL_API_KEY: ${BINBOT_MODEL_API_KEY:-}
      BINBOT_VOLC_API_KEY: ${BINBOT_VOLC_API_KEY:-}
      BINBOT_VOLC_ASR_API_KEY: ${BINBOT_VOLC_ASR_API_KEY:-}
      BINBOT_VOLC_TTS_API_KEY: ${BINBOT_VOLC_TTS_API_KEY:-}
      BINBOT_SEEDUPLEX_API_KEY: ${BINBOT_SEEDUPLEX_API_KEY:-}
      BINBOT_FEISHU_APP_SECRET: ${BINBOT_FEISHU_APP_SECRET:-}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/readyz', timeout=2)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5

  binbot-gateway:
    build:
      context: ../binbot_web
    restart: unless-stopped
    ports:
      - "${BINBOT_HTTP_BIND:-127.0.0.1}:${BINBOT_HTTP_PORT:-8080}:8080"
    depends_on:
      binbot-server:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  binbot-data:
